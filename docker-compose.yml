services:
  postgres:
    image: postgres:15
    container_name: memoryos_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  vector_service:
    build:
      context: .
      dockerfile: vector_service/Dockerfile
    container_name: memoryos_vector
    ports:
      - "8001:8001"
    volumes:
      - ./vector_service/memory.index:/app/memory.index
    restart: unless-stopped

volumes:
  postgres_data:
